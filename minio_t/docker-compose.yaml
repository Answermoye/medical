version: "3.8"

services:
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: minio_t
    restart: always

    ports:
      - "9100:9000"     # MinIO API 端口
      - "9101:9001"     # MinIO Console 控制台端口

    environment:
      MINIO_ROOT_USER: admin        # 用户名（Access Key）
      MINIO_ROOT_PASSWORD: admin123 # 密码（Secret Key）

    volumes:
      - ./data:/data                # 数据持久化目录
      - ./config:/root/.minio_t       # 配置目录（可选）

    command: server /data --console-address ":9001"